version: "3.9"

services:
  mithril-client:
    image: ghcr.io/input-output-hk/mithril-client:latest
    volumes:
      - node-db:/db
    command: >
      cardano-db download
      --download-dir /db
      --aggregator-endpoint https://aggregator.release-preprod.api.mithril.network/aggregator
      --genesis-verification-key 563519d0092c63eb6a6054f492b6db4fbd3195af916b23a776c539bf3378d30e
      latest
    profiles: ["init"]

  cardano-node:
    image: ghcr.io/intersectmbo/cardano-node:10.5.4
    user: "1000:1000"
    environment:
      - NETWORK=${CARDANO_NETWORK:-mainnet}
    volumes:
      - ./node-db:/data/db
      - ./ipc:/ipc
      - ./params:/params
      # Note: cardano-node does not strictly need signing keys to operate as a relay/passive node
    restart: always
    healthcheck:
      test: ["CMD", "test", "-S", "/ipc/node.socket"]
      interval: 10s
      timeout: 5s
      retries: 5

  ogmios:
    image: cardanosolutions/ogmios:latest
    command: [
      "--host", "0.0.0.0",
      "--node-socket", "/ipc/node.socket",
      "--node-config", "/params/config.json"
    ]
    volumes:
      - ./ipc:/ipc:ro
      - ./params:/params:ro
    ports:
      - "1338:1337"
    restart: on-failure
    depends_on:
      cardano-node:
        condition: service_healthy

  hydra-node:
    image: ghcr.io/cardano-scaling/hydra-node:1.2.0
    user: "1000:1000"
    command: 
      [
        "--node-id", "314",
        "--api-host", "0.0.0.0", 
        "--api-port", "4001",
        "--listen", "0.0.0.0:5001",
        "--monitoring-port", "6001",
        "--node-socket", "/ipc/node.socket",
        "--mainnet",
        "--hydra-signing-key", "/keys/hydra.sk",
        "--cardano-signing-key", "/keys/cardano.sk",
        "--ledger-protocol-parameters", "/params/protocol-parameters.json",
        "--persistence-dir", "/persistence"
      ]
    volumes:
      - ./ipc:/ipc:ro
      - ./keys/hydra.sk:/keys/hydra.sk:ro
      - ./keys/cardano.sk:/keys/cardano.sk:ro
      - ./params:/params:ro
      - ./hydra-persistence:/persistence
    ports:
      - "5001:5001"
      - "4001:4001"
      - "6001:6001"
    restart: on-failure
    depends_on:
      cardano-node:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4001"]
      interval: 10s
      timeout: 5s
      retries: 5

  hydralite-api:
    image: hydralite:v1.0.0
    env_file:
      - .env
    ports:
      - "8000:8000"
    restart: on-failure
    depends_on:
      hydra-node:
        condition: service_healthy
    # Uses default HEALTHCHECK and CMD from Dockerfile

  hydralite-autoscaler:
    image: hydralite:v1.0.0
    env_file:
      - .env
    command: ["python", "autoscaler/monitor.py"]
    restart: always
    depends_on:
      hydralite-api:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # required for autoscaler to spawn heads

volumes:
  node-db:
  hydra-persistence:
